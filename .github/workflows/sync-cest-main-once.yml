name: Synchronize CEST with reviewed main
on:
  push:
    branches: [feat/cest-declarative-integration]
    paths: ['.github/workflows/sync-cest-main-once.yml']
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'bogdanparvu18/msc-graduate-project' && github.ref == 'refs/heads/feat/cest-declarative-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.github/
            /notebooks/phase3/phase3_01_terminology_mapping.ipynb
            /outputs/phase3/sector1/terminology/
            /scripts/phase3/
            /tests/
            /docs/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2,<3' 'pyarrow>=14' 'xlrd>=2' 'pytest>=8,<9'
      - name: Merge exact PR27 source without overwriting CEST changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags --filter=blob:none --depth=100 origin feat/cest-declarative-integration 07d6a44ae03ff3573230ff574ae16286b263bc99
          python - <<'PY'
          import ast, copy, json, subprocess, tempfile
          from pathlib import Path
          target='07d6a44ae03ff3573230ff574ae16286b263bc99'
          path='notebooks/phase3/phase3_01_terminology_mapping.ipynb'
          def cmd(*args): return subprocess.check_output(args,text=True).strip()
          base=cmd('git','merge-base','HEAD',target)
          def read(ref): return json.loads(cmd('git','show',ref+':'+path))
          original, ours, theirs=read(base),read('HEAD'),read(target)
          changed=cmd('git','diff','--name-only',base,target).splitlines()
          if changed != [path]: raise SystemExit('Unexpected changes in target main; inspect before merge')
          merged=copy.deepcopy(ours)
          if not len(original['cells'])==len(ours['cells'])==len(theirs['cells']): raise SystemExit('Notebook cell structure changed')
          for i,(b,o,t) in enumerate(zip(original['cells'],ours['cells'],theirs['cells'])):
              for key in set(b)|set(o)|set(t):
                  bv,ov,tv=b.get(key),o.get(key),t.get(key)
                  if tv==bv or tv==ov: continue
                  if ov==bv:
                      merged['cells'][i][key]=copy.deepcopy(tv);continue
                  if key!='source': raise SystemExit('Conflicting non-source notebook field')
                  with tempfile.TemporaryDirectory() as d:
                      paths=[Path(d)/name for name in ('ours','base','theirs')]
                      for p,v in zip(paths,(ov,bv,tv)):p.write_text(''.join(v))
                      r=subprocess.run(['git','merge-file','-p',*map(str,paths)],capture_output=True,text=True)
                      if r.returncode: raise SystemExit('Conflicting Python source: cell '+str(i))
                      merged['cells'][i][key]=r.stdout.splitlines(keepends=True)
          merge=subprocess.run(['git','merge','--no-commit','--no-ff',target])
          if merge.returncode not in (0,1): raise SystemExit('Git merge failed')
          # Reuse the shared validator newly introduced by PR27; retain CEST's narrower size cap.
          runtime_path=Path('scripts/phase3/cest_runtime.py')
          old=runtime_path.read_text();start=old.index('def _cest_github_manifest(data):');stop=old.index('    expected = hashlib.sha256',start)
          new_head='''CEST_GITHUB_MANIFEST_SPECIFICATION = {
              "label": "CEST", "manifest_schema": "mmvqa-cest-github-manifest-v1",
              "artifact_schema": "mmvqa-cest-transcription-v1", "artifact_label": "CEST transcription",
              "content_hash_field": "package_content_sha256",
          }


          def _cest_github_manifest(data):
              manifest = validate_github_manifest(data, CEST_GITHUB_MANIFEST_SPECIFICATION)
              artifact = manifest["artifact"]
              if artifact["bytes"] > 8 * 1024 * 1024:
                  raise ValueError("CEST artifact size exceeds 8 MiB")
              for key in ("original_document_sha256", "source_fingerprint"):
                  _rag_github_sha(manifest.get(key), key)
          '''
          import textwrap
          new_head=textwrap.dedent(new_head)
          # Dedent only the common YAML/Python literal indentation, preserving function indentation.
          lines=new_head.splitlines()
          # Normalize this small explicit block rather than relying on the surrounding literal margin.
          new_head='CEST_GITHUB_MANIFEST_SPECIFICATION = {"label":"CEST", "manifest_schema":"mmvqa-cest-github-manifest-v1", "artifact_schema":"mmvqa-cest-transcription-v1", "artifact_label":"CEST transcription", "content_hash_field":"package_content_sha256"}\n\n\ndef _cest_github_manifest(data):\n    manifest = validate_github_manifest(data, CEST_GITHUB_MANIFEST_SPECIFICATION)\n    artifact = manifest["artifact"]\n    if artifact["bytes"] > 8 * 1024 * 1024:\n        raise ValueError("CEST artifact size exceeds 8 MiB")\n    for key in ("original_document_sha256", "source_fingerprint"):\n        _rag_github_sha(manifest.get(key), key)\n'
          new=old[:start]+new_head+old[stop:]
          runtime_path.write_text(new)
          source=''.join(merged['cells'][11]['source'])
          if source.count(old)!=1:raise SystemExit('CEST embedded helper anchor mismatch')
          merged['cells'][11]['source']=source.replace(old,new).splitlines(keepends=True)
          for cell in merged['cells']:
              if cell['cell_type']=='code':ast.parse(''.join(cell['source']))
          Path(path).write_text(json.dumps(merged,ensure_ascii=False,indent=2)+'\n')
          manifest_path=Path('outputs/phase3/sector1/terminology/cest_2005_manifest.json')
          m=json.loads(manifest_path.read_text());m['artifact']['schema_version']='mmvqa-cest-transcription-v1'
          manifest_path.write_text(json.dumps(m,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          builder=Path('scripts/phase3/build_cest_assets.py');s=builder.read_text()
          anchor="manifest={'schema_version':'mmvqa-cest-github-manifest-v1','artifact':{"
          if s.count(anchor)!=1:raise SystemExit('Manifest generator anchor mismatch')
          builder.write_text(s.replace(anchor,anchor+"'schema_version':'mmvqa-cest-transcription-v1',"))
          patcher=Path('scripts/phase3/integrate_cest_notebook.py');s=patcher.read_text()
          blob=cmd('git','rev-parse',target+':'+path)
          s=s.replace("BASE_BLOB = '5144fb8be5f4e40eda495e69f18c665aa78aa173'","BASE_BLOB = '"+blob+"'")
          patcher.write_text(s)
          test=Path('tests/test_cest_integration.py');s=test.read_text()
          s=s.replace("'_rag_github_temporary','load_github_verified_artifact'","'_rag_github_temporary','validate_github_manifest','load_github_verified_artifact'")
          anchor="    exec_source(code(11).split('GI_GITHUB_CONFIG =')[0],ns)"
          extra="    ns['GITHUB_MANIFEST_LIMITS'] = {'manifest_bytes':1024*1024,'artifact_bytes':32*1024*1024}\n"
          if s.count(anchor)!=1:raise SystemExit('Test engine anchor mismatch')
          s=s.replace(anchor,extra+anchor)
          s+='\n\ndef test_cest_reuses_shared_manifest_validator(engine,monkeypatch):\n    original=engine["validate_github_manifest"]; calls=[]\n    def traced(data,specification):\n        calls.append(specification["label"])\n        return original(data,specification)\n    monkeypatch.setitem(engine,"validate_github_manifest",traced)\n    engine["_cest_github_manifest"]((OUT/"cest_2005_manifest.json").read_bytes())\n    assert calls==["CEST"]\n\n\n@pytest.mark.parametrize("change",["schema","oversized"])\ndef test_cest_shared_manifest_guards(engine,change):\n    manifest=json.loads((OUT/"cest_2005_manifest.json").read_text())\n    if change=="schema":manifest["artifact"]["schema_version"]="wrong"\n    data=json.dumps(manifest).encode()\n    if change=="oversized":data=b" "*(1024*1024+1)+data\n    with pytest.raises(ValueError):engine["_cest_github_manifest"](data)\n'
          test.write_text(s)
          fixture=Path('tests/cest_regression_baseline.json');f=json.loads(fixture.read_text());f['base_commit']=target
          fixture.write_text(json.dumps(f,indent=2)+'\n')
          doc=Path('docs/CEST_INTEGRATION.md');s=doc.read_text().replace('Base: `7a3215d963e035e5e157d82a14e8226e47a78d8f` (PR26 merged).','Base: `07d6a44ae03ff3573230ff574ae16286b263bc99` (PR26 and PR27 merged). CEST also reuses the shared manifest validator from PR27.')
          doc.write_text(s)
          subprocess.run(['git','add',path,'scripts/phase3','tests/test_cest_integration.py','tests/cest_regression_baseline.json','docs/CEST_INTEGRATION.md',str(manifest_path)],check=True)
          if cmd('git','diff','--name-only','--diff-filter=U'):raise SystemExit('Unresolved merge files remain')
          PY
      - name: Regression tests after integration with PR27
        run: python -m pytest tests/test_cest_integration.py -q --junitxml=cest-sync-results.xml
      - name: Publish successful merge to feature branch only
        run: |
          git commit -m 'Preserve PR27 and reuse shared manifest validation for CEST'
          git push origin HEAD:refs/heads/feat/cest-declarative-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cest-sync-results
          path: |
            cest-sync-results.xml
            notebooks/phase3/phase3_01_terminology_mapping.ipynb
            scripts/phase3/cest_runtime.py
            scripts/phase3/integrate_cest_notebook.py
            scripts/phase3/build_cest_assets.py
            tests/test_cest_integration.py
            tests/cest_regression_baseline.json
            docs/CEST_INTEGRATION.md
            outputs/phase3/sector1/terminology/cest_2005_manifest.json
          retention-days: 2
