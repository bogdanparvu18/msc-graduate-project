name: CEST regression
on:
  pull_request:
    paths:
      - '.github/workflows/cest-regression.yml'
      - 'notebooks/phase3/phase3_01_terminology_mapping.ipynb'
      - 'outputs/phase3/sector1/terminology/**'
      - 'scripts/phase3/**'
      - 'tests/test_cest_integration.py'
      - 'tests/cest_regression_baseline.json'
  push:
    branches: [feat/cest-declarative-integration]
    paths:
      - '.github/workflows/cest-regression.yml'
      - 'notebooks/phase3/phase3_01_terminology_mapping.ipynb'
      - 'outputs/phase3/sector1/terminology/**'
      - 'scripts/phase3/**'
      - 'tests/test_cest_integration.py'
      - 'tests/cest_regression_baseline.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            notebooks/phase3/phase3_01_terminology_mapping.ipynb
            outputs/phase3/sector1/terminology
            scripts/phase3
            tests
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2,<3' 'pyarrow>=14' 'xlrd>=2' 'pytest>=8,<9'
      - run: python -m pytest tests/test_cest_integration.py -q --junitxml=cest-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cest-test-results
          path: cest-test-results.xml
          retention-days: 7
