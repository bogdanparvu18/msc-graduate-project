name: Phase 3 input loader

on:
  pull_request:
    paths: ['mmvqa/**', 'tests/**', 'configs/phase3/**', 'notebooks/phase3/**', 'pyproject.toml', '.github/workflows/phase3.yml']
  push:
    branches: [main]
    paths: ['mmvqa/**', 'tests/**', 'configs/phase3/**', 'notebooks/phase3/**', 'pyproject.toml', '.github/workflows/phase3.yml']

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mmvqa
            tests
            configs/phase3
            notebooks/phase3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
