name: Prepare reviewed CEST implementation
on:
  push:
    branches: [feat/cest-declarative-integration]
    paths: ['.github/workflows/prepare-cest-once.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'bogdanparvu18/msc-graduate-project' && github.ref == 'refs/heads/feat/cest-declarative-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.github/
            /notebooks/phase3/phase3_01_terminology_mapping.ipynb
            /outputs/phase3/sector1/terminology/
            /scripts/phase3/
            /tests/
            /docs/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2,<3' 'pyarrow>=14' 'xlrd>=2' 'pytest>=8,<9'
      - name: Verify and materialize authored source files
        run: |
          python - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          files = [Path(f'.github/cest-authoring/payload-{i:02d}.txt') for i in range(6)]
          raw = zlib.decompress(base64.b64decode(''.join(p.read_text().strip() for p in files), validate=True))
          expected = 'aa6e926bfba963475f1631f0279b592f319830df0b53c935b9c5375e81088c2b'
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit('Authored payload fingerprint mismatch')
          payload = json.loads(raw)
          allowed = {'scripts/phase3/build_cest_assets.py', 'scripts/phase3/cest_runtime.py',
                     'scripts/phase3/integrate_cest_notebook.py', 'tests/test_cest_integration.py',
                     'tests/cest_regression_baseline.json', 'docs/CEST_INTEGRATION.md',
                     '.github/workflows/cest-regression.yml'}
          if set(payload) != allowed:
              raise SystemExit('Unexpected authoring paths')
          for name, text in payload.items():
              if not isinstance(text, str):
                  raise SystemExit('Source content must be text')
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          print('Verified 7 authored files:', expected)
          PY
      - name: Build source-located CEST transcription and notebook integration
        run: |
          python scripts/phase3/build_cest_assets.py
          python scripts/phase3/integrate_cest_notebook.py
      - name: Run CEST and unchanged-contract regression tests
        run: python -m pytest tests/test_cest_integration.py -q --junitxml=cest-preparation-results.xml
      - name: Commit only reviewed implementation to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add notebooks/phase3/phase3_01_terminology_mapping.ipynb scripts/phase3/build_cest_assets.py scripts/phase3/cest_runtime.py scripts/phase3/integrate_cest_notebook.py tests/test_cest_integration.py tests/cest_regression_baseline.json docs/CEST_INTEGRATION.md
          git add outputs/phase3/sector1/terminology/cest_2005_package.json outputs/phase3/sector1/terminology/cest_2005_manifest.json outputs/phase3/sector1/terminology/CEST_COPYRIGHT.txt outputs/phase3/sector1/terminology/phase3_01_rag_evidence.json outputs/phase3/sector1/terminology/rag_evidence_manifest.json outputs/phase3/sector1/terminology/ulcer_policy_regression.json
          git rm .github/cest-authoring/payload-*.txt
          git diff --cached --stat
          git commit -m 'Integrate source-verified CEST 2005 with declarative mapping pipeline'
          git push origin HEAD:refs/heads/feat/cest-declarative-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cest-preparation-results
          path: cest-preparation-results.xml
          retention-days: 7
